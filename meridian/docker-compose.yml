# Meridian Docker Compose
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose up -d redis    # Start only Redis
#   docker compose logs -f worker # Follow worker logs
#
# Note: GPU services (docling, vllm) require NVIDIA Docker runtime

services:
  # =========================================================================
  # Infrastructure
  # =========================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # =========================================================================
  # GPU Services
  # =========================================================================
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3-VL-8B-Instruct
      --quantization fp8
      --gpu-memory-utilization 0.55
      --max-num-seqs 128
      --max-model-len 8192
      --enable-chunked-prefill
      --enable-prefix-caching

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # =========================================================================
  # Workers
  # =========================================================================
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - VLLM_API_URL=http://vllm:8000/v1/chat/completions
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DOCLING_INSTANCES=http://docling:8001
    command: >
      celery -A meridian.workers.celery_app worker
      --loglevel=info
      --concurrency=3

volumes:
  redis_data:
  qdrant_data:
  ollama_data:
